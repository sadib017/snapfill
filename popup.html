<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SnapFill</title>
<style>
  body { font: 13px system-ui, sans-serif; width: 320px; margin: 0; color: #111827; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #e5e7eb; }
  .logo { width: 26px; height: 26px; }
  nav { display: flex; gap: 4px; padding: 0 10px; border-bottom: 1px solid #e5e7eb; }
  nav button { border: 0; background: none; padding: 10px 12px; font: 600 13px system-ui; color: #6b7280; border-bottom: 2px solid transparent; cursor: pointer; }
  nav button.on { color: #1d4ed8; border-color: #2563eb; }
  section { padding: 14px; }
  label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 12px; color: #374151; }
  input { width: 100%; box-sizing: border-box; height: 32px; padding: 0 8px; border: 1px solid #d1d5db; border-radius: 6px; font: 13px system-ui; margin-top: 3px; }
  .primary { width: 100%; height: 44px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: 600 14px system-ui; cursor: pointer; }
  .secondary { height: 32px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; }
  .hint { color: #6b7280; font-size: 12px; text-align: center; margin: 8px 0 0; }
  #status { margin-top: 10px; color: #047857; min-height: 1em; text-align: center; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row input { margin: 0; }
  .row button { flex: none; width: 28px; height: 28px; border: 0; background: none; color: #b91c1c; font-size: 18px; cursor: pointer; }
  h2 { font-size: 13px; margin: 14px 0 6px; }
</style>
<header><img class="logo" src="icons/icon48.png" alt=""><strong>SnapFill</strong></header>
<nav>
  <button id="tab-fill" class="on">Fill</button>
  <button id="tab-info">My info</button>
</nav>
<section id="fill-view">
  <button id="fill" class="primary">Fill this page</button>
  <p class="hint">Shortcut: Alt + Shift + F</p>
  <div id="status" role="status"></div>
</section>
<section id="info-view" hidden>
  <form id="form">
    <label>First name <input name="firstName"></label>
    <label>Last name <input name="lastName"></label>
    <label>Email <input name="email" type="email"></label>
    <label>Phone <input name="phone"></label>
    <label>Username <input name="username"></label>
    <label>Street address <input name="address"></label>
    <label>City <input name="city"></label>
    <label>State / province <input name="state"></label>
    <label>ZIP / postal code <input name="zip"></label>
    <label>Country <input name="country"></label>
    <label>Company <input name="company"></label>
    <label>Job title <input name="jobTitle"></label>
    <label>LinkedIn URL <input name="linkedin"></label>
    <label>Website / portfolio <input name="website"></label>
    <h2>My own fields</h2>
    <p class="hint" style="text-align:left;margin:0 0 6px">Filled into any box whose label contains the field name.</p>
    <div id="custom"></div>
    <button type="button" id="add" class="secondary">+ Add field</button>
    <button class="primary" style="margin-top:12px">Save</button>
  </form>
</section>
<script src="inject.js"></script>
<script src="popup.js"></script>
</html>
